<style>
:root{--bg:#0c0c0d;--s:#18181b;--t:#f3f3f4;--m:#9b9ba3;--ac:#19b3a6}

:focus{outline:none}

#md,#pl{position:fixed;inset:0;display:none;z-index:30}

.dt{max-width:980px;margin:4vh auto;background:var(--bg);border-radius:12px;overflow:hidden;animation:fi .25s}
.bd{height:340px;background:#000 center top/cover;position:relative}
.bd:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 70%)}

.di .rr{padding-left:0;padding-right:0}

.pb{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;gap:14px;align-items:center;background:linear-gradient(#000a,transparent);transition:opacity .3s}
.pb.h{opacity:0;pointer-events:none}.pb span{flex:1;font-weight:600}

@media(max-width:700px){#side{inset:auto 0 0 0;width:100%!important;flex-direction:row;justify-content:space-around;padding:6px}.lg,.n span{display:none}#mn{margin:0 0 64px}.hc,.tb,.fl,.g,.rr,h2,.dots,.pg{padding-left:20px;padding-right:20px}.hc{left:0;bottom:40px}.hc h1{font-size:30px}.di{padding:0 20px 24px}}
</style></head><body>
<nav id="side"></nav><main id="mn"></main><div id="md"></div><div id="pl"></div><div id="ts"></div>

$('#side').innerHTML='<div class="lg"><i>D</i>Dhorlaflix</div>'+[['home','Home'],['search','Search'],['movies','Movies'],['tv','Series'],['settings','Settings']].map(([v,l])=>`<button class="n" data-v="${v}"><svg viewBox="0 0 24 24"><path d="${IC[v]}"/></svg><span>${l}</span></button>`).join('');

/* ---- reading the ISP folders ---- */
const VID=/\.(mp4|mkv|webm|m4v)$/i,SEAS=/^(season|s\d+|series)\b/i;
async function list(u){const r=await fetch(u);if(!r.ok)throw 0;const h=await r.text(),o=[],re=/<a href="([^"?#]+)"[^>]*>[^<]*<\/a>\s*(\d{1,2}-\w{3}-\d{4} \d{2}:\d{2})?/g;let m;

 const f=e.filter(x=>!x.dir&&VID.test(x.name)),d=e.filter(x=>x.dir),host=new URL(u).host,name=decodeURIComponent(u.replace(/\/$/,'').split('/').pop());
 const add=(n,files)=>out.push({name:n,cat,d:Math.max(...files.map(x=>x.d)),files:files.map(x=>({...x,h:host,q:(x.name.match(/(2160|1080|720|480)p/i)||['Auto'])[0].toLowerCase()}))});
 if(depth==1&&f.length)f.forEach(x=>add(x.name,[x]));
 else if(f.length)add(name,f);
 else if(depth>1&&d.length&&d.every(x=>SEAS.test(x.name))){const fs=[];await pool(d,async s=>{try{(await list(s.url)).filter(x=>!x.dir&&VID.test(x.name)).forEach(x=>fs.push({...x,sn:s.name}))}catch{}});if(fs.length)add(name,fs)}
 if(!f.length&&!(depth>1&&d.length&&d.every(x=>SEAS.test(x.name)))&&depth<4)await pool(d,x=>scan(x.url,depth?cat:x.name,depth+1,out),6);
}
function parse(n){let t=n.replace(/\.(mp4|mkv|webm|m4v)$/i,'').replace(/\[[^\]]*\]/g,' ').replace(/[._]/g,' '),o=t;
 const q=t.search(/\b(2160p|1080p|720p|480p|WEB ?Rip|WEB ?DL|Blu ?Ray|HD ?Rip|HDTC|x26[45]|S\d{2}(E\d+)?)\b/i);if(q>0)t=t.slice(0,q);
 const ys=[...t.matchAll(/\b((?:19|20)\d{2})\b/g)];let y='';
 if(ys.length){const l=ys[ys.length-1];y=l[1];const b=t.slice(0,l.index).trim();t=b||t.replace(l[0],'')}
 return{t:t.replace(/\s+/g,' ').trim()||o.trim(),y}}
const mergeBy=(a,fn)=>{const o={};for(const i of a){const k=fn(i);if(!k){o[Math.random()]=i;continue}const x=o[k];if(x){x.files.push(...i.files);x.d=Math.max(x.d,i.d);x.m=x.m||i.m}else o[k]=i}return Object.values(o)};
async function getMeta(i){const k=i.type+'|'+i.t.toLowerCase()+'|'+i.y;if(k in tm){i.m=tm[k];return}

 try{let r=(await(await fetch(q(i.y))).json()).results||[];if(!r.length&&i.y)r=(await(await fetch(q(''))).json()).results||[];const x=r[0];
  i.m=tm[k]=x?{id:x.id,p:x.poster_path,b:x.backdrop_path,o:x.overview,r:x.vote_average,l:x.original_language,g:x.genre_ids,y:(x.release_date||x.first_air_date||'').slice(0,4),tt:x.title||x.name}:null}catch{}}
const index=()=>{L={};lib.forEach(i=>L[i.k]=i)};

 mn.innerHTML='<div class="ld">Loading your library</div>';const raw=[];let ok=0;

 lib=mergeBy(lib,i=>i.type+'|'+i.t.toLowerCase().replace(/[^a-z0-9]/g,'')+'|'+i.y);lib.sort((a,b)=>b.d-a.d);lib.forEach(i=>i.k=i.type+'|'+i.t+'|'+i.y);index();

 if(md.style.display!='block'&&pl.style.display!='block')render()}

function home(){const s=lib,cw=ls.get('cw',{}),hs=s.filter(i=>i.m?.b).slice(0,5),SO=['Telugu','Tamil','Malayalam','Kannada'],AS=['Korean','Japanese','Chinese','Thai'];

 mn.innerHTML=(hs.length?'<div id="hero"></div><div class="dots" id="dots"></div>':'<div style="height:40px"></div>')+rows.filter(r=>r[1].length).map(([t,a])=>`<h2>${t}</h2><div class="rr">${a.slice(0,20).map(card).join('')}</div>`).join('');
 if(hs.length){let n=0;const show=()=>{const i=hs[n],m=i.m,h=$('#hero');h.className='hero';h.style.backgroundImage=`url(${img(m.b,'w1280')})`;h.style.animation='none';h.offsetWidth;h.style.animation='';

function groups(i){const g={};i.files.sort((a,b)=>(a.sn||'').localeCompare(b.sn||'')||a.name.localeCompare(b.name,undefined,{numeric:true})).forEach(f=>{const c=(f.name.match(/S\d+E\d+|\d+x\d+/i)||[''])[0].toLowerCase(),k=i.type=='tv'?(f.sn||'')+'|'+(c||f.name):'x';(g[k]=g[k]||{n:c?c.toUpperCase():f.name.replace(VID,''),sn:f.sn,alts:[]}).alts.push(f)});return Object.values(g)}
function open(k){const i=L[k];if(!i)return;const m=i.m||{},gs=groups(i),cw=ls.get('cw',{});let eps='';
 if(i.type=='tv'){let last;eps=gs.map((g,x)=>{const h=g.sn!==last?`<h3>${esc(g.sn||'Episodes')}</h3>`:'';last=g.sn;return h+`<button class="ep" data-ep="${esc(k)}|${x}">${esc(g.n)}</button>`}).join('')}
 const rel=lib.filter(x=>x.k!=k&&x.type==i.type&&x.m&&((x.m.g||[]).some(g=>(m.g||[]).includes(g))||lang(x)==lang(i))).sort((a,b)=>b.m.r-a.m.r).slice(0,12);

const closeM=()=>{md.style.display='none';md.innerHTML=''};
function listing(){const A=lib.filter(i=>i.type==(view=='tv'?'tv':'movie')),n={};A.forEach(i=>n[lang(i)]=(n[lang(i)]||0)+1);
 const ls_=['All',...Object.keys(n).sort((a,b)=>n[b]-n[a])],gs=[...new Set(A.flatMap(i=>(i.m?.g||[]).map(g=>GN[g]).filter(Boolean)))].sort(),ys=[...new Set(A.map(i=>i.y||i.m?.y).filter(Boolean))].sort().reverse();

 mn.innerHTML=`<div class="tb">${ls_.map(l=>`<button data-l="${l}" class="${l=='All'?'on':''}">${l}</button>`).join('')}</div><div class="fl"><select data-f="g"><option value="">All genres</option>${gs.map(g=>`<option>${g}</option>`).join('')}</select><select data-f="y"><option value="">All years</option>${ys.map(y=>`<option>${y}</option>`).join('')}</select><select data-f="s"><option value="d">Recently added</option><option value="r">Top rated</option><option value="y">Year</option><option value="a">A to Z</option></select></div><div class="g" id="gr"></div>`;grid(A)}

 r.sort({d:(a,b)=>b.d-a.d,r:(a,b)=>(b.m?.r||0)-(a.m?.r||0),y:(a,b)=>(b.y||b.m?.y||0)-(a.y||a.m?.y||0),a:(a,b)=>a.t.localeCompare(b.t)}[F.s]);

/* ---- player ---- */
function closeP(){const v=$('#v');if(v)v.pause();pl.style.display='none';pl.innerHTML=''}
let bt;const showBar=()=>{const b=$('.pb');if(!b)return;b.classList.remove('h');clearTimeout(bt);bt=setTimeout(()=>b.classList.add('h'),3500)};

 pl.style.display='block';pl.innerHTML=`<video id="v" autoplay controls playsinline></video><div class="pb"><button id="bk" aria-label="Back">&#8592;</button><span>${esc(i.m?.tt||i.t)} ${i.type=='tv'?esc(g.n):''}</span>${g.alts.length>1?`<select id="qs">${g.alts.map((a,x)=>`<option value="${x}" ${x==ai?'selected':''}>${a.q} (${a.h})</option>`).join('')}</select>`:''}</div>`;
 const v=$('#v'),pos=ls.get('pos',{});v.src=f.url;v.onloadedmetadata=()=>{const p=pos[f.url];if(p>10&&p<v.duration-30)v.currentTime=p};
 let last=0;v.ontimeupdate=()=>{if(Date.now()-last>5000){last=Date.now();const p=ls.get('pos',{}),c=ls.get('cw',{});p[f.url]=v.currentTime;c[k]=Date.now();ls.set('pos',p);ls.set('cw',c)}};
 v.onended=()=>{if(i.type=='tv'&&gs[gi+1])play(k,gi+1);else closeP()};
 v.onerror=()=>toast('This file will not play. Check you are on your ISP wifi, or try another quality.');
 const q=$('#qs');if(q)q.onchange=e=>{const t=v.currentTime;v.src=g.alts[e.target.value].url;v.onloadedmetadata=()=>{v.currentTime=t;v.play()}};
 $('#bk').onclick=closeP;pl.onmousemove=showBar;showBar()}

/* ---- events and remote control ---- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-k],[data-ep],[data-l],[data-v],[data-x],#rt,#sv');if(!t)return;
 if(t.dataset.k)open(t.dataset.k);
 else if(t.dataset.ep){const[k,g]=t.dataset.ep.split('|');play(k,+g)}
 else if(t.dataset.l){F.lang=t.dataset.l;document.querySelectorAll('.tb button').forEach(b=>b.classList.toggle('on',b==t));grid(lib.filter(i=>i.type==(view=='tv'?'tv':'movie')))}
 else if(t.dataset.v){view=t.dataset.v;closeM();render()}
 else if('x' in t.dataset)closeM();
 else if(t.id=='rt')boot();
 else if(t.id=='sv'){cfg={key:$('#ky').value.trim(),src:$('#sr').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>s.endsWith('/')?s:s+'/')};ls.set('cfg',cfg);view='home';boot()}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){F[f]=e.target.value;grid(lib.filter(i=>i.type==(view=='tv'?'tv':'movie')))}});
function nav(dx,dy){const root=md.style.display=='block'?md:document,cur=document.activeElement,els=[...root.querySelectorAll('[tabindex="0"],button,select,input,textarea')].filter(e=>e.offsetParent&&!e.disabled);
 const r0=els.includes(cur)?cur.getBoundingClientRect():{left:0,top:0,width:0,height:0},cx=r0.left+r0.width/2,cy=r0.top+r0.height/2;let best,bs=1e9;
 for(const e of els){if(e===cur)continue;const r=e.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy;if(dx&&x*dx<=0)continue;if(dy&&y*dy<=0)continue;const s=dx?Math.abs(x)+Math.abs(y)*3:Math.abs(y)+Math.abs(x)*3;if(s<bs){bs=s;best=e}}
 if(best){best.focus();best.scrollIntoView({block:'center',inline:'center'})}else if(!els.includes(cur))els[0]?.focus()}
addEventListener('keydown',e=>{
 if(pl.style.display=='block'){const v=$('#v');if(e.key=='Escape'||e.key=='Backspace'){closeP();e.preventDefault()}else if(v&&e.key=='ArrowLeft'){v.currentTime-=10;e.preventDefault()}else if(v&&e.key=='ArrowRight'){v.currentTime+=10;e.preventDefault()}showBar();return}
 const t=document.activeElement.tagName,typing=t=='INPUT'||t=='TEXTAREA';
 if(e.key=='Escape'||(e.key=='Backspace'&&!typing)){if(md.style.display=='block'){closeM();e.preventDefault()}return}
 const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(d&&!typing&&!(t=='SELECT'&&d[1])){e.preventDefault();nav(...d)}
 else if(e.key=='Enter'&&t=='DIV')document.activeElement.click()});
boot();
</script></body></html>
